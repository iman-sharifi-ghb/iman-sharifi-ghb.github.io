{% comment %}
  BibTeX block with a copy button. Params: pub (the publication document)
{% endcomment %}
{% assign p = include.pub %}
{% assign bib_id = p.slug | default: p.title | slugify | prepend: 'bibtex-' %}
<div class="bibtex">
  <button class="bibtex__copy" type="button" data-copy="#{{ bib_id }}" hidden><i class="fas fa-fw fa-copy" aria-hidden="true"></i> <span>Copy BibTeX</span></button>
  <pre class="bibtex__code" id="{{ bib_id }}"><code>{{ p.bibtex | strip | escape }}</code></pre>
</div>
